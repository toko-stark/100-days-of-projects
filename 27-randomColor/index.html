<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Random Color · Day 027</title>
<link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="style.css"></head>
<body><a class="back" href="../">← Hub</a>
<main class="app"><section class="panel center">
  <div class="panel-head"><h1>Random Color</h1><span class="day">No. 027</span></div>
  <div class="color-box" id="colorBox"></div>
  <button id="generateBtn" class="primary">Generate</button>
</section></main>
<script>
const colorBox = document.getElementById('colorBox');
const generateBtn = document.getElementById('generateBtn');
function rnd() { return Math.floor(Math.random() * 256); }
generateBtn.addEventListener('click', () => {
  colorBox.style.backgroundColor = `rgb(${rnd()}, ${rnd()}, ${rnd()})`;
});
</script>
</body></html>
