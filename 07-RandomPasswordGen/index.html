<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Password Generator · Day 007</title>
<link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="style.css"></head>
<body><a class="back" href="../">← Hub</a>
<main class="app"><section class="panel">
  <div class="panel-head"><h1>Password Generator</h1><span class="day">No. 007</span></div>
  <input class="password-input" type="text" placeholder="Generate a password" disabled>
  <div class="checkbox-group">
    <h3 class="serif">Character types</h3>
    <label class="cb"><input type="checkbox" id="uppercase" checked>Uppercase (A–Z)</label>
    <label class="cb"><input type="checkbox" id="lowercase" checked>Lowercase (a–z)</label>
    <label class="cb"><input type="checkbox" id="numbers" checked>Numbers (0–9)</label>
    <label class="cb"><input type="checkbox" id="symbols" checked>Symbols (!@#$%)</label>
    <label>Length<input type="number" id="length" placeholder="Length" value="12" min="1" max="64"></label>
  </div>
  <button class="btn primary" id="btn" style="width:100%">Generate</button>
</section></main>
<script src="script.js" defer></script></body></html>
