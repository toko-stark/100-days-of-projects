<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Chat Bot · Day 003</title>
<link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="style.css"></head>
<body><a class="back" href="../">← Hub</a>
<div class="chat-layout">
  <aside class="section-sidebar">
    <div class="side-head"><h2 class="serif">Chat Bot</h2><span class="day mono">No. 003</span></div>
    <button class="btn create-chat primary">+ New Chat</button>
    <p class="sidebar-title mono">Chats</p>
    <ul class="list plain">
      <li class="list-item"><a href="#">Example Chat 1</a></li>
      <li class="list-item"><a href="#">Example Chat 2</a></li>
      <li class="list-item"><a href="#">Example Chat 3</a></li>
      <li class="list-item"><a href="#">Example Chat 4</a></li>
    </ul>
  </aside>
  <section class="section-chat">
    <h1 class="chat-title">What can I help with?</h1>
    <form class="form">
      <input class="input-ask-anything" id="input-new-chat" placeholder="Ask anything" required>
      <button type="submit" id="submit" class="primary">↑</button>
    </form>
  </section>
  <section class="section-active-chatting --chat-section hidden">
    <div class="messages">
      <p class="msg msg-user">Message from user</p>
      <p class="msg msg-ai">Message from AI</p>
    </div>
    <form class="form">
      <input class="input-ask-anything --chatting" id="input-active-chat" placeholder="Ask anything" required>
      <button type="submit" class="primary">↑</button>
    </form>
  </section>
</div>
<script src="script.js"></script></body></html>
