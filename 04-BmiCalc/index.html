<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="style.css"></head>
<body><a class="back" href="../">← Hub</a>
<main class="app"><section class="panel">
  <div class="panel-head"><h1>BMI Calculator</h1><span class="day">No. 004</span></div>

    <label>Your Height (cm)<input class="form-input" type="number" id="height-input" placeholder="e.g., 175" required></label>

    <button class="form-button primary" type="submit" style="width:100%;margin-top:.5rem">Calculate BMI</button>
    <div class="bmi-result">
      <input class="form-input result-input" type="text" id="bmi-input" placeholder="—" disabled>
      <div class="result--class"></div>
    </div>
  </form>
  <div class="container-result"></div>
</section></main>
