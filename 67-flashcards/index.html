<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flashcards · Day 067</title>
<link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="style.css"></head>
<body><a class="back" href="../">← Hub</a>
<main class="app"><section class="panel center">
  <div class="panel-head"><h1>Flashcards</h1><span class="day">No. 067</span></div>
  <div id="card"><div class="inner"><div class="front" id="f"></div><div class="back-side" id="b"></div></div></div>
  <div class="controls center" style="justify-content:center">
    <button id="prev" class="secondary">←</button>
    <button id="flip" class="primary">Flip</button>
    <button id="next" class="secondary">→</button>
  </div>
  <div class="add">
    <input id="qi" placeholder="Front (question)">
    <input id="ai" placeholder="Back (answer)">
    <button id="add" class="ghost">+ Add</button>
  </div>
  <p id="count" class="muted mono"></p>
</section></main>
<script src="script.js"></script></body></html>
