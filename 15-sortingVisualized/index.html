<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sorting Visualizer · Day 015</title>
<link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="style.css"></head>
<body><a class="back" href="../">← Hub</a>
<main class="app-wide">
  <div class="panel-head"><h1>Sorting Visualizer</h1><span class="day mono">No. 015</span></div>
  <div class="controls">
    <label class="inline">Size <input type="range" id="size" min="10" max="100" value="50"></label>
    <label class="inline">Speed <input type="range" id="speed" min="100" max="500" value="300"></label>
    <select id="algorithm" style="max-width:180px">
      <option value="bubble">Bubble Sort</option>
      <option value="selection">Selection Sort</option>
      <option value="insertion">Insertion Sort</option>
      <option value="merge">Merge Sort</option>
      <option value="quick">Quick Sort</option>
    </select>
    <button class="sort primary">Sort</button>
  </div>
  <div class="sortingArea"></div>
</main>
<script src="script.js"></script></body></html>
