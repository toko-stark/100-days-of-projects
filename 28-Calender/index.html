<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendar Countdown · Day 028</title>
<link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="style.css"></head>
<body><a class="back" href="../">← Hub</a>
<main class="app"><section class="panel">
  <div class="panel-head"><h1>Date Countdown</h1><span class="day">No. 028</span></div>
  <ul id="countdown" class="plain countdown">
    <li class="countdown-item"><span class="time" id="days">00</span><small>Days</small></li>
    <li class="countdown-item"><span class="time" id="hours">00</span><small>Hours</small></li>
    <li class="countdown-item"><span class="time" id="minutes">00</span><small>Minutes</small></li>
    <li class="countdown-item"><span class="time" id="seconds">00</span><small>Seconds</small></li>
  </ul>
  <div class="row" style="margin-top:1rem">
    <input type="date" id="date" style="flex:1">
    <button id="btn" class="primary">Set Date</button>
  </div>
</section></main>
<script src="script.js"></script></body></html>
