<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rock Paper Scissors · Day 001</title>
<link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="style.css"></head>
<body><a class="back" href="../">← Hub</a>
<main class="app"><section class="panel center">
  <div class="panel-head"><h1>Rock · Paper · Scissors</h1><span class="day">No. 001</span></div>
  <form class="form-container" onsubmit="return false">
    <div class="form">
      <h2 class="serif" style="font-size:1rem;color:var(--muted);font-weight:500;margin-bottom:1rem">Choose your move</h2>
      <div class="btns">
        <button class="btn rock" id="Rock" type="button">✊</button>
        <button class="btn paper" id="Paper" type="button">✋</button>
        <button class="btn scissors" id="Scissors" type="button">✌</button>
      </div>
    </div>
  </form>
  <p class="bot-actions"></p>
  <div class="score-row">
    <div>You <span class="score you">0</span></div>
    <div class="muted">vs</div>
    <div>CPU <span class="score computer">0</span></div>
  </div>
</section></main>
<script src="script.js"></script></body></html>
