<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clock · Day 006</title>
<link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="style.css"></head>
<body><a class="back" href="../">← Hub</a>
<main class="app"><section class="panel center">
  <div class="panel-head"><h1>Clock</h1><span class="day">No. 006</span></div>
  <div class="time" id="time" aria-label="Current time">
    <span id="hours">12</span><span class="colon">:</span><span id="minutes">00</span><span class="colon">:</span><span id="seconds">00</span>

  <label class="switch">
    <input type="checkbox" id="formatToggle">
    <span>24-hour format</span>
  </label>
</section></main>
<script src="script.js" defer></script></body></html>
