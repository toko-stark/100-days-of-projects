<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculator · Day 012</title>
<link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="style.css"></head>
<body><a class="back" href="../">← Hub</a>
<main class="app"><section class="panel">
  <div class="panel-head"><h1>Calculator</h1><span class="day">No. 012</span></div>
  <div class="calculator">
    <input type="text" class="display" disabled>
    <div class="buttons grid">
      <button class="btn fn">c</button>
      <button class="btn fn">+/-</button>
      <button class="btn fn">%</button>
      <button class="btn op">÷</button>
      <button class="btn num">7</button>
      <button class="btn num">8</button>
      <button class="btn num">9</button>
      <button class="btn op">×</button>
      <button class="btn num">4</button>
      <button class="btn num">5</button>
      <button class="btn num">6</button>
      <button class="btn op">−</button>
      <button class="btn num">1</button>
      <button class="btn num">2</button>
      <button class="btn num">3</button>
      <button class="btn op">+</button>
      <button class="btn num --grow">0</button>
      <button class="btn num">.</button>
      <button class="btn op">=</button>
    </div>
  </div>
</section></main>
<script type="module" src="script.js"></script></body></html>
