<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guess The Number · Day 013</title>
<link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="style.css"></head>
<body><a class="back" href="../">← Hub</a>
<main class="app"><section class="panel center">
  <div class="panel-head"><h1>Guess My Number</h1><span class="day">No. 013</span></div>
  <p class="between muted">Between 1 and 20</p>
  <div class="number">?</div>
  <div class="row" style="justify-content:center;gap:.5rem">
    <input type="number" class="guess" style="max-width:120px;text-align:center;font-family:var(--serif);font-size:1.3rem">
    <button class="btn check primary">Check</button>
  </div>
  <p class="message" style="margin-top:1rem;font-family:var(--serif);font-style:italic;color:var(--accent);min-height:1.5rem">Start guessing...</p>
  <div class="scores mono">
    <span>Score <b class="score">20</b></span>
    <span>Highscore <b class="highscore">0</b></span>
  </div>
  <button class="btn again ghost" style="margin-top:.75rem">Again</button>
</section></main>
<script src="script.js"></script></body></html>
